schema_version: 1

context:
  name: anneal
  version: "0.12.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/HaoZeke/anneal/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 9e066f243decebf7e43cdb232c04c63fc083f4c9864afe5420b7b6e147bc59d4

build:
  number: 0
  script:
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - ${{ stdlib('c') }}
    - cargo-bundle-licenses
  host:
    - python >=3.10
    - pip
    - maturin >=1.5,<2.0
    - array-api-compat >=1.12
    - numpy >=1.24.1
  run:
    - python >=3.10
    - numpy >=1.24.1
    - array-api-compat >=1.12

tests:
  - python:
      imports:
        - anneal
      pip_check: true

about:
  homepage: https://github.com/HaoZeke/anneal
  summary: Simulated annealing and quenching for Python
  license: MIT
  license_file:
    - LICENSE.txt
    - THIRDPARTY.yml
  repository: https://github.com/HaoZeke/anneal

extra:
  recipe-maintainers:
    - HaoZeke
